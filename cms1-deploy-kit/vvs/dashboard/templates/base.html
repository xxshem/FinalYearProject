<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VVS — {% block title %}{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f4f6f8; }
  .navbar { background:#1a5f2a !important; }
  .navbar-brand, .nav-link { color:#fff !important; }
  .nav-link:hover { color:#c8e6c9 !important; }
  .stat-card { border-left:4px solid #1a5f2a; transition:transform .15s; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.08); }
  .stat-num { font-size:1.8rem; font-weight:700; color:#1a5f2a; }
  .badge-granted { background:#198754; }
  .badge-denied  { background:#dc3545; }
  .card { border:none; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card-header { background:#fff; border-bottom:1px solid #e9ecef; font-weight:600; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🎓 DKUT VVS Dashboard</a>
    <ul class="navbar-nav ms-auto flex-row gap-3">
      <li><a class="nav-link" href="/">Home</a></li>
      <li><a class="nav-link" href="/lora">LoRa</a></li>
      <li><a class="nav-link" href="/operational">Ops</a></li>
      <li><a class="nav-link" href="/power">Power</a></li>
      <li><a class="nav-link" href="/logs">Logs</a></li>
      <li><a class="nav-link" href="/events">Events</a></li>
      <li><a class="nav-link" href="/data">Raw Data</a></li>
    </ul>
  </div>
</nav>

<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
