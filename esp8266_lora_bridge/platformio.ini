[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@1.200.0
    platformio/tool-scons@4.41101.0
    platformio/toolchain-xtensa@2.100300.220621

monitor_speed = 9600
upload_speed = 115200    ; safe default for flashing

lib_deps =
    sandeepmistry/LoRa@0.8.0
    marcoschwartz/LiquidCrystal_I2C@1.1.4
