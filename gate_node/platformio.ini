[env:esp32cam]
platform = espressif32@7.1.3
board = esp32cam
framework = arduino

platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-mkfatfs@2.0.1
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@2.230.0
    platformio/tool-scons@4.41101.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5

monitor_speed = 9600
upload_speed = 9600
; This flag is now the only reset instruction
upload_flags = --before=default_reset

; --- DELETE THESE TWO LINES ---
; board_upload.before_reset = no_reset
; board_upload.after_reset = no_reset
; ------------------------------

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

lib_deps =
    arduino-libraries/Arduino_JSON@0.2.2
    alvarowolfx/ESP32QRCodeReader@1.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations
    -Wno-implicit-function-declaration
    -DGATE_ID_VALUE=\"GATE_A\"

[env:gate_b]
extends = env:esp32cam
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations
    -Wno-implicit-function-declaration
    -DGATE_ID_VALUE=\"GATE_B\"

[env:gate_c]
extends = env:esp32cam
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations
    -Wno-implicit-function-declaration
    -DGATE_ID_VALUE=\"GATE_C\"